<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Achievement Python</title>
  <desc id="desc">Your next achievement, one workflow away. A Python toolkit with an interactive menu and command-line workflows.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22312c" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#162820"/>
      <stop offset="1" stop-color="#101917"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="20" fill="#0d1512"/>
  <rect x="700" width="480" height="360" fill="url(#grid)"/>
  <path d="M20 0H1180" stroke="#87e6ad" stroke-width="4"/>
  <g font-family="'Segoe UI', sans-serif">
    <text x="56" y="65" fill="#87e6ad" font-size="14" font-weight="700" letter-spacing="2.5">GITHUB ACHIEVEMENT PYTHON</text>
    <text x="52" y="137" fill="#f1f7f3" font-size="47" font-weight="700" letter-spacing="-1.5">Your next achievement,</text>
    <text x="52" y="194" fill="#f1f7f3" font-size="47" font-weight="700" letter-spacing="-1.5">one workflow away.</text>
    <text x="56" y="242" fill="#b1c4b9" font-size="19">Set up your tokens. Pick a badge. Follow your progress.</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <rect x="56" y="278" width="224" height="40" rx="8" fill="#1b3025" stroke="#365342"/>
    <text x="73" y="304" fill="#87e6ad">&gt; python main.py</text>
    <text x="300" y="304" fill="#b1c4b9">MENU + COMMAND LINE</text>
  </g>
  <rect x="755" y="48" width="390" height="264" rx="14" fill="url(#panel)" stroke="#365342"/>
  <path d="M755 92H1145" stroke="#365342"/>
  <g fill="#607f6c">
    <circle cx="776" cy="70" r="4"/>
    <circle cx="792" cy="70" r="4"/>
    <circle cx="808" cy="70" r="4"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="14">
    <text x="833" y="75" fill="#b1c4b9">achievement / workflow</text>
    <path d="M793 132V260" stroke="#365342" stroke-width="2"/>
    <g fill="#87e6ad">
      <circle cx="793" cy="132" r="6"/>
      <circle cx="793" cy="196" r="6"/>
      <circle cx="793" cy="260" r="6"/>
    </g>
    <text x="818" y="130" fill="#f1f7f3" font-weight="700">01  CONFIGURE</text>
    <text x="818" y="151" fill="#b1c4b9">Your accounts. Your repository.</text>
    <text x="818" y="194" fill="#f1f7f3" font-weight="700">02  RUN</text>
    <text x="818" y="215" fill="#b1c4b9">Choose from five badge workflows.</text>
    <text x="818" y="258" fill="#f1f7f3" font-weight="700">03  CHECK</text>
    <text x="818" y="279" fill="#b1c4b9">Track operations and badge status.</text>
  </g>
</svg>

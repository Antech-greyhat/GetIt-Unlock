[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "GetIt-Unlock"
version = "0.3.0"
description = "GetIt-Unlock: a Python CLI for GitHub achievement workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["rich>=14.0,<16"]

[project.scripts]
getit-unlock = "getit_unlock.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["getit_unlock*"]
namespaces = false

[tool.setuptools.package-data]
"getit_unlock.messages" = ["presets/*.txt"]

name: Python checks

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Check Bash launcher
        shell: bash
        run: |
          bash -n main.sh
          bash main.sh list --json
          bash main.sh run pull-shark --repo example/repository --count 1 --dry-run
      - name: Check PowerShell launcher
        shell: pwsh
        run: |
          ./main.ps1 list --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./main.ps1 run pull-shark --repo example/repository --count 1 --dry-run
      - run: python -m pip install .
      - name: Check installed CLI
        working-directory: ${{ runner.temp }}
        run: getit-unlock list
      - name: Check installed message presets
        working-directory: ${{ runner.temp }}
        run: getit-unlock --env-file "${{ github.workspace }}/.env.example" run pull-shark --count 1 --dry-run
